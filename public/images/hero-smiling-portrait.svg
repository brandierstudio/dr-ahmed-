<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" fill="none">
  <defs>
    <radialGradient id="faceGrad" cx="46%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#FFEAD9"/>
      <stop offset="55%" stop-color="#F5C9AE"/>
      <stop offset="100%" stop-color="#DDA484"/>
    </radialGradient>
    <linearGradient id="hairGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#4A2E1B"/>
      <stop offset="50%" stop-color="#2E1B0F"/>
      <stop offset="100%" stop-color="#1A0E07"/>
