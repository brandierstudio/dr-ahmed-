      <stop offset="100%" stop-color="#E6EBEE"/>
    </linearGradient>
    <linearGradient id="bottomMaskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="72%" stop-color="white" stop-opacity="1"/>
      <stop offset="98%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="portraitFade">
